<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>username</label>
    <input  placeholder="Enter your name"> <br>

    <input type="text" placeholder="username"><br>

    <input type="email" placeholder="abc@gmail.com"><br>
    
    <input type="number" placeholder="Enter your number"><br>

    <input type="search" placeholder="search"><br>

    <input type="url" placeholder="Enter your url"><br>

    <input type="tel" placeholder="Enter your number"><br>

    <!-- NUmber input -->
    <input type="number" min="18" max="100" placeholder="Enter your age"><br>
    <input type="range" min="0" max="100" placeholder="Enter your age"><br>
    <input type="date" placeholder="Enter your date"><br>
    <input type="time" placeholder="Enter your time"><br>
    <input type="month" placeholder="Enter your month"><br>
    <input type="week" placeholder="Enter your week"><br>
    <input type="datetime-local" placeholder="Enter your datetime"><br>

    <!--selection input-->
    <input type="checkbox">
    <label>i agree to the terms and conditions</label>

    <input type="file">
    <input type="colour">

    <!--validation-->
    <input type="text" required><br>

    <input type="text" pattern="[A-Za-z]{3}" title="only 3 letters are allowed"><br>

    <input type="text" pattern="[0-9]{10}" title="only 10 digits are allowed"><br>

    <input type="text" minlength="3" maxlength="10" placeholder="Enter your name"><br>

    <textarea placeholder="Enter your message"></textarea><br>


</body>
</html>
